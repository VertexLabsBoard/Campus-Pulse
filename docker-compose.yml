services:
  db:
    image: postgres:16-alpine
    container_name: campus_pulse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_pulse
      POSTGRES_USER: campus_pulse
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_pulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_pulse_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/campus_pulse
      DB_USERNAME: campus_pulse
      DB_PASSWORD: changeme
      JWT_SECRET: change-this-in-production-use-a-long-random-string
      APP_CORS_ORIGINS: http://localhost:5173
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus_pulse_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"

volumes:
  pg_data:
