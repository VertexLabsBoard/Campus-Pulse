# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=campus-pulse-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_pulse}
spring.datasource.username=${DB_USERNAME:campus_pulse}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ─── Security / CORS ──────────────────────────────────────────────────────────
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173}

# ─── OpenAPI / Swagger ────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ─── Logging ──────────────────────────────────────────────────────────────────
# IMPORTANT: Never log tokens, passwords, or private report text
logging.level.com.campuspulse=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ─── Resend API ──────────────────────────────────────────────────────────────
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Campus Pulse <onboarding@resend.dev>}
