# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=campus-pulse-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_pulse}
spring.datasource.username=${DB_USERNAME:campus_pulse}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ─── Security / CORS ──────────────────────────────────────────────────────────
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

# ─── OpenAPI / Swagger ────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# Disable mail health indicator — email delivery has been removed
management.health.mail.enabled=false

# ─── Logging ──────────────────────────────────────────────────────────────────
# IMPORTANT: Never log tokens, passwords, or private report text
logging.level.com.campuspulse=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ─── Demo Account Configuration ──────────────────────────────────────────────
# These are the three pre-provisioned demo accounts.
# Override via environment variables in Render or your deployment platform.
# Do NOT commit real passwords to source control.
demo.student.email=${DEMO_STUDENT_EMAIL:demo.student@s.amity.edu}
demo.student.password=${DEMO_STUDENT_PASSWORD:StudentDemo2025!}
demo.staff.email=${DEMO_STAFF_EMAIL:demo.staff@amity.edu}
demo.staff.password=${DEMO_STAFF_PASSWORD:StaffDemo2025!}
demo.admin.email=${DEMO_ADMIN_EMAIL:demo.admin@amity.edu}
demo.admin.password=${DEMO_ADMIN_PASSWORD:AdminDemo2025!}
