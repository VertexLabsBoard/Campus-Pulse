# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=campus-pulse-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_pulse}
spring.datasource.username=${DB_USERNAME:campus_pulse}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ─── Security / CORS ──────────────────────────────────────────────────────────
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

# ─── OpenAPI / Swagger ────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ─── Logging ──────────────────────────────────────────────────────────────────
# IMPORTANT: Never log tokens, passwords, or private report text
logging.level.com.campuspulse=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ─── Resend API ──────────────────────────────────────────────────────────────
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Campus Pulse <onboarding@resend.dev>}

# ─── JavaMail / SMTP (Gmail App Password, Brevo, or Custom SMTP) ──────────────
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:c06a73001@smtp-brevo.com}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:xsmtpsib-dc8d8b9acaf7c5e59904072272351f1fe5b87e99e96fc0311555f3047b6113fb-KWmObw62FSuUjBqs}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from-address=${APP_MAIL_FROM:abhishekbackup0910@gmail.com}
app.mail.from-name=${APP_MAIL_FROM_NAME:Amity University Dispatch Portal}

