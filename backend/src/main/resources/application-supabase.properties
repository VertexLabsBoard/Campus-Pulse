# ─── Supabase PostgreSQL Configuration ──────────────────────────────────────
# Activate this profile with: SPRING_PROFILES_ACTIVE=supabase
# (or combined with prod: SPRING_PROFILES_ACTIVE=prod,supabase)

# ─── Supabase PostgreSQL Datasource ───────────────────────────────────────────
# You can use either:
# 1. Direct connection (port 5432):
#    jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
# 2. Transaction / Session Pooler (port 6543 or 5432):
#    jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP configured for Supabase limits)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─── Flyway Migration ─────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ─── Actuator Health ──────────────────────────────────────────────────────────
# Email delivery has been removed — disable MailHealthIndicator to prevent
# health-check failures caused by SMTP connection attempts on startup.
management.health.mail.enabled=false

logging.level.com.campuspulse=INFO
