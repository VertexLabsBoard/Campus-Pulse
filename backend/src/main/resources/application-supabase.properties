# ─── Supabase PostgreSQL & Mail OTP Configuration ──────────────────────────────
# Activate this profile with: -Dspring.profiles.active=supabase or SPRING_PROFILES_ACTIVE=supabase

# ─── Supabase PostgreSQL Datasource ───────────────────────────────────────────
# You can use either:
# 1. Direct connection (port 5432):
#    jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
# 2. Transaction / Session Pooler (port 6543 or 5432):
#    jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP configured for Supabase limits)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─── Flyway Migration (V1 through V7) ─────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ─── Mail OTP (SMTP) ─────────────────────────────────────────────────────────
# Works with Supabase custom SMTP, Gmail, Brevo, Resend, SendGrid, or Office365
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Custom Email Sender Details
app.mail.from-address=${APP_MAIL_FROM:noreply@amity.edu}
app.mail.from-name=${APP_MAIL_FROM_NAME:Amity University Dispatch Portal}

logging.level.com.campuspulse=INFO

# ─── Resend API ──────────────────────────────────────────────────────────────
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Campus Pulse <onboarding@resend.dev>}
