# ─── Local Profile (No Docker required) ──────────────────────────────────────
# File-backed H2 database saved in backend/data/campuspulse
spring.datasource.url=jdbc:h2:file:./data/campuspulse;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# H2 web console enabled at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

logging.level.com.campuspulse=INFO
